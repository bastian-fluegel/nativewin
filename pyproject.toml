[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nativewin"
version = "0.1.0"
description = "Zero-dependency Windows GUI toolkit (ctypes + Win32)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nativewin contributors" }]
keywords = ["gui", "win32", "ctypes", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Documentation = "https://github.com/example/nativewin/tree/main/.docs"
Changelog = "https://github.com/example/nativewin/blob/main/changelog.md"

[tool.setuptools.packages.find]
include = ["nativewin*"]

[tool.setuptools.package-data]
nativewin = ["py.typed"]
